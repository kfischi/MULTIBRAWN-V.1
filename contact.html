<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIBRAWN - צור קשר</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --site-accent: #FF5EA1; --site-text: #1a0b2e; }
        body { font-family: 'Heebo', sans-serif; background: linear-gradient(135deg, #00E0FF 0%, #2D7FFF 50%, #A06BFF 100%); color: var(--site-text); overflow-x: hidden; min-height: 100vh; }
        h1 { font-family: 'Playfair Display', serif; }
        
        #main-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); height: 90px; display: flex; align-items: center; }
        nav { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo img { width: 80px; height: 80px; }
        .logo span { font-size: 2rem; font-weight: 800; color: var(--site-text); font-family: 'Playfair Display', serif; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--site-text); text-decoration: none; font-size: 1.1rem; font-weight: 500; }
        .nav-cta { background: var(--site-accent); color: white !important; padding: 0.7rem 1.8rem; border-radius: 50px; font-weight: 600; box-shadow: 0 4px 20px rgba(255, 94, 161, 0.4); }

        .chat-section { padding: 8rem 2rem 4rem; max-width: 1000px; margin: 0 auto; text-align: center; }
        .chat-container { max-width: 800px; margin: 2rem auto; background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border-radius: 20px; overflow: hidden; height: 650px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        
        .chat-header { padding: 1.5rem; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 1rem; }
        .chat-bot-avatar { width: 50px; height: 50px; background: var(--site-accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
        .message { display: flex; gap: 1rem; max-width: 85%; }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 1rem 1.5rem; border-radius: 20px; font-size: 1rem; line-height: 1.5; }
        .bot .bubble { background: rgba(255,255,255,0.9); color: #1a0b2e; border-top-right-radius: 5px; }
        .user .bubble { background: var(--site-accent); color: white; border-top-left-radius: 5px; }
        
        .chat-options { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .chat-option-btn { background: transparent; border: 1px solid var(--site-accent); color: white; padding: 0.5rem 1.2rem; border-radius: 50px; cursor: pointer; transition: 0.2s; }
        .chat-option-btn:hover { background: var(--site-accent); }
        
        .chat-input-area { padding: 1.5rem; background: rgba(0,0,0,0.3); display: flex; gap: 1rem; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); }
        .chat-input-area input { flex: 1; padding: 1rem 1.5rem; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none; }
        .chat-send-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--site-accent); color: white; border: none; cursor: pointer; }
        
        footer { background: rgba(0,0,0,0.3); padding: 3rem 2rem; text-align: center; margin-top: 4rem; border-top: 1px solid rgba(255,255,255,0.2); }
        
        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
</head>
<body>
    <header id="main-header">
        <nav>
            <a href="index.html" class="logo"><img src="https://github.com/kfischi/MULTIBRAWN-V.1/raw/main/Gallery/לוגו2.png" alt="Logo"><span>MULTIBRAWN</span></a>
            <div class="nav-links">
                <a href="index.html">דף הבית</a>
                <a href="gallery.html">גלריה</a>
                <a href="tips.html">טיפים חשובים</a>
                <a href="about.html">אודות</a>
                <a href="contact.html" class="nav-cta" style="background:white; color:var(--site-accent) !important;">צור קשר</a>
            </div>
        </nav>
    </header>

    <div class="chat-section">
        <h1 class="text-4xl font-bold mb-4">הבוט החכם של Multibrawn</h1>
        <p class="text-xl opacity-80 mb-6">ענו על מספר שאלות קצרות ואמצא לכם את הלוקיישן המושלם</p>
        
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-bot-avatar"><i class="fas fa-robot"></i></div>
                <div><h3 class="font-bold text-white">Multi-Agent</h3><span class="text-xs text-green-400">● מחובר</span></div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="הקלידו תשובה..." onkeypress="handleKeyPress(event)">
                <button class="chat-send-btn" onclick="sendUserText()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <footer>
        <div style="margin-bottom:1rem;"><img src="https://github.com/kfischi/MULTIBRAWN-V.1/raw/main/Gallery/לוגו2.png" style="width:60px;margin:0 auto;"></div>
        <p style="margin-top:2rem; opacity:0.7;">© 2025 MULTIBRAWN</p>
    </footer>

    <script>
        // CHATBOT LOGIC (Simplified for brevity, full logic same as previous)
        let chatState = { step: 0, data: {} };
        const questions = {
            start: { text: "היי! 👋 אני הבוט החכם. מה אתם מחפשים?", type: "buttons", options: [ { label: "🏡 צימר", value: "צימר", next: "dates" }, { label: "🏛️ וילה", value: "וילה", next: "dates" }, { label: "💍 אירוע", value: "אירוע", next: "dates" } ], field: "type" },
            dates: { text: "מתי תרצו להגיע?", type: "date", next: "budget", field: "date" },
            budget: { text: "מה התקציב המשוער?", type: "buttons", options: [{label:"עד 1500", value:"1500", next:"finish"}, {label:"גמיש", value:"גמיש", next:"finish"}], field: "budget" },
            finish: { text: "סיימנו! שולח פרטים...", type: "action", action: "whatsapp", onLoad: () => {
                fetch('https://webmasterpro.app.n8n.cloud/webhook/6286a24e-50bb-48f2-8925-4f09b3533108', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(chatState.data) });
            }}
        };

        let currentQ = "start";
        window.onload = () => renderQuestion();

        function renderQuestion() {
            const q = questions[currentQ];
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'message bot';
            msg.innerHTML = `<div class="bubble">${q.text}</div>`;
            container.appendChild(msg);
            
            if (q.type === 'buttons') {
                const opts = document.createElement('div');
                opts.className = 'chat-options';
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'chat-option-btn';
                    btn.innerText = opt.label;
                    btn.onclick = () => handleInput(opt.value, opt.next);
                    opts.appendChild(btn);
                });
                container.appendChild(opts);
            }
            
            if (q.onLoad) q.onLoad();
        }

        function handleInput(val, next) {
            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="message user"><div class="bubble">${val}</div></div>`;
            chatState.data[questions[currentQ].field] = val;
            currentQ = next;
            setTimeout(renderQuestion, 500);
        }
    </script>
</body>
</html>
