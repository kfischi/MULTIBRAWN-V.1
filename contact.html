<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הסוכן האישי שלך | Multibrawn</title>
    <meta name="description" content="מצא את ה-Vibe המושלם שלך. הסוכן האישי של Multibrawn מוצא לך את הלוקיישן המושלם בדרך כיפית ואינטראקטיבית.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #00E0FF, #2D7FFF, #A06BFF);
            --secondary-bg-glass: rgba(255, 255, 255, 0.15);
            --accent-primary: #FF5EA1; /* ורוד-קוראל */
            --accent-secondary: #00E0FF; /* טורקיז */
            --white: #FAFAFA;
            --text-dark: #1a0b2e;
            --text-light-on-dark: #FAFAFA;
            --light-grey: #444;
            --font-display: 'Heebo', sans-serif;
            --font-body: 'Heebo', sans-serif;
            --header-height: 80px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background: var(--primary-bg);
            color: var(--text-dark);
            line-height: 1.6;
            overflow: hidden; /* מונע גלילה בזמן המשחק */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* --- Header (Standard) --- */
        header {
            position: relative; /* לא קבוע, חלק מהדף */
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
        }
        nav {
            max-width: 1400px; margin: 0 auto; padding: 1.5rem 3rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 1rem; text-decoration: none; }
        .logo img { width: 45px; height: 45px; }
        .logo span { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); font-family: var(--font-display); }
        .nav-links { display: flex; gap: 2.5rem; align-items: center; }
        .nav-links a { color: var(--text-dark); text-decoration: none; font-size: 0.95rem; transition: opacity 0.3s; font-weight: 500; }
        .nav-links a:hover { opacity: 0.6; }
        .nav-cta {
            background: var(--accent-primary);
            color: var(--white) !important; padding: 0.7rem 1.8rem; border-radius: 6px;
            font-weight: 600; text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 94, 161, 0.4);
            transition: all 0.3s ease;
        }
        .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 94, 161, 0.6); }

        /* --- Vibe Bot Wrapper --- */
        .vibe-bot-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        .bot-header {
            margin-bottom: 2rem;
        }
        .bot-header h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }
        .bot-header p {
            font-size: clamp(1rem, 2vw, 1.1rem);
            color: var(--light-grey);
            font-weight: 400;
        }

        /* --- Card Stack --- */
        .card-stack {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
            perspective: 1000px;
        }
        
        .vibe-card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--secondary-bg-glass);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center bottom;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transform: translateY(20px) scale(0.9);
            opacity: 0;
            z-index: 1;
        }

        /* Stacking effect - controlled by JS */
        
        /* Animation classes */
        .vibe-card.go-no {
            transform: translateX(-150%) rotate(-30deg) !important;
            opacity: 0 !important;
        }
        .vibe-card.go-yes {
            transform: translateX(150%) rotate(30deg) !important;
            opacity: 0 !important;
        }

        .vibe-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            text-align: center;
        }
        .card-text h3 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        /* --- Controls --- */
        .vibe-controls {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }
        .control-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            font-size: 2rem;
        }
        .control-btn:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        #no-btn {
            background: var(--white);
            color: #e11d48; /* Red */
        }
        #yes-btn {
            background: var(--accent-primary);
            color: var(--white);
        }

        /* --- Progress Bar --- */
        .progress-bar-container {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            margin-top: 2rem;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--accent-primary);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* --- Summary Screen --- */
        .summary-screen {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .summary-screen h2 {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }
        .summary-screen p {
            font-size: 1.2rem;
            color: var(--light-grey);
            max-width: 500px;
            margin-bottom: 2rem;
        }
        .summary-list {
            list-style: none;
            color: var(--text-dark);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            text-align: right;
        }
        .summary-list li {
            margin-bottom: 0.5rem;
        }
        .summary-list i {
            color: var(--accent-primary);
            margin-left: 0.5rem;
        }
        .whatsapp-cta {
            background: #25D366; /* WhatsApp Green */
            color: var(--white);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.6);
        }

        @media (max-width: 768px) {
            nav { padding: 1rem 1.5rem; }
            .nav-links { display: none; }
            .card-stack { height: 450px; }
            .vibe-controls { margin-top: 1.5rem; }
            .control-btn { width: 65px; height: 65px; font-size: 1.5rem; }
            .progress-bar-container { margin-top: 1.5rem; }
        }
    </style>
</head>
<body>
    <header id="header">
        <nav>
            <a href="/" class="logo">
                <img src="https://github.com/kfischi/MULTIBRAWN-V.1/raw/main/Gallery/לוגו2.png" alt="MULTIBRAWN">
                <span>MULTIBRAWN</span>
            </a>
            <div class="nav-links">
                <a href="/">דף הבית</a>
                <a href="about.html">אודות</a>
                <a href="gallery.html">גלריה</a>
                <a href="contact.html" class="nav-cta">צור קשר</a>
            </div>
        </nav>
    </header>

    <main class="vibe-bot-container">

        <!-- This is shown during the game -->
        <div id="game-container">
            <div class="bot-header">
                <h1>ברוכים הבאים לסוכן ה-Vibe</h1>
                <p>במקום טפסים, בואו נשחק. החליקו ימינה (❤️) על ה-Vibe שמתאים לכם, או שמאלה (❌) על מה שלא. בואו נתחיל!</p>
            </div>

            <div class="card-stack" id="card-stack">
                <!-- Cards will be injected here by JS -->
            </div>

            <div class="vibe-controls">
                <button class="control-btn" id="no-btn"><i class="fas fa-times"></i></button>
                <button class="control-btn" id="yes-btn"><i class="fas fa-heart"></i></button>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- This is shown at the end -->
        <div class="summary-screen" id="summary-screen">
            <h2>מצאנו התאמה!</h2>
            <p>סיננתי את המאגר האקסקלוסיבי שלנו ומצאתי מספר מקומות שעונים בדיוק על ה-Vibe שלכם:</p>
            <ul class="summary-list" id="summary-list">
                <!-- Summary will be injected here -->
            </ul>
            <a href="#" id="whatsapp-link" class="whatsapp-cta" target="_blank">
                <i class="fab fa-whatsapp"></i>
                קבלו את ההצעות מהסוכן האישי שלי
            </a>
        </div>

    </main>

    <script>
        // --- The Brain: All Questions ---
        const vibeQuestions = [
            // Phase 1: Vibe
            { id: 'vibe_party', text: 'אנרגיות ומסיבה 🥳', type: 'vibe', img: 'https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818934/22_tt9jvz.jpg' },
            { id: 'vibe_romance', text: 'שקט ורומנטיקה 🥂', type: 'vibe', img: 'https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818996/Zimmer2_ge7g6h.jpg' },
            { id: 'vibe_family', text: 'זמן איכות משפחתי 👨‍👩‍👧‍👦', type: 'vibe', img: 'https://raw.githubusercontent.com/kfischi/MULTIBRAWN-V.1/main/Gallery/Villas/3.jpeg' },
            { id: 'vibe_event', text: 'אירוע יוקרתי 💍', type: 'vibe', img: 'https://res.cloudinary.com/dptyfvwyo/image/upload/v1762003191/1_tsc6xx.jpg' },
            
            // Phase 2: Must-Haves
            { id: 'feature_pool', text: 'חייב בריכה מחוממת? 🏊', type: 'feature', img: 'https://raw.githubusercontent.com/kfischi/MULTIBRAWN-V.1/main/Gallery/Villas/Villa_Wow.jpg' },
            { id: 'feature_view', text: 'הנוף הוא העיקר? 🌄', type: 'feature', img: 'https://raw.githubusercontent.com/kfischi/MULTIBRAWN-V.1/main/Gallery/Villas/1.jpg' },
            { id: 'feature_noise', text: 'צריך אישור לרעש? 🎶', type: 'feature', img: 'https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818934/20_t6yw8m.jpg' },
            { id: 'feature_hotel', text: 'בא לכם פינוק של מלון? 🛎️', type: 'feature', img: 'https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Hotel1_ihkey7.jpg' }
        ];

        const stack = document.getElementById('card-stack');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const progressBar = document.getElementById('progress-bar');
        const gameContainer = document.getElementById('game-container');
        const summaryContainer = document.getElementById('summary-screen');
        const summaryList = document.getElementById('summary-list');
        const whatsappLink = document.getElementById('whatsapp-link');

        let currentCardIndex = 0;
        let userChoices = { vibes: [], features: [] };
        let allCards = []; // Store all card elements

        // --- Initialize Cards ---
        function initCards() {
            stack.innerHTML = '';
            // Create cards in FORWARDS order (0, 1, 2...)
            for (let i = 0; i < vibeQuestions.length; i++) {
                const card = vibeQuestions[i];
                const cardEl = document.createElement('div');
                cardEl.className = 'vibe-card';
                cardEl.innerHTML = `
                    <img src="${card.img}" alt="${card.text}">
                    <div class="card-text">
                        <h3>${card.text}</h3>
                    </div>
                `;
                stack.appendChild(cardEl);
            }
            
            // Store all card elements in reverse order for stacking logic
            allCards = Array.from(stack.querySelectorAll('.vibe-card')).reverse();
            updateCardStack();
        }

        // --- Update Card Visual Stack ---
        function updateCardStack() {
            allCards.forEach((card, index) => {
                const relativeIndex = index - (allCards.length - 1 - currentCardIndex);
                
                if (relativeIndex === 0) {
                    card.style.transform = 'translateY(0) scale(1)';
                    card.style.opacity = '1';
                    card.style.zIndex = '3';
                } else if (relativeIndex === 1) {
                    card.style.transform = 'translateY(10px) scale(0.95)';
                    card.style.opacity = '1';
                    card.style.zIndex = '2';
                } else if (relativeIndex === 2) {
                    card.style.transform = 'translateY(20px) scale(0.9)';
                    card.style.opacity = '1';
                    card.style.zIndex = '1';
                } else {
                    card.style.transform = `translateY(20px) scale(0.9)`;
                    card.style.opacity = '0';
                    card.style.zIndex = '0';
                }
            });
        }

        // --- Handle User Choice ---
        function handleChoice(choice) {
            const currentCardData = vibeQuestions[currentCardIndex];
            const cardEl = stack.children[currentCardIndex];

            if (!cardEl) return;

            // 1. Save choice
            if (choice) {
                if (currentCardData.type === 'vibe') {
                    userChoices.vibes.push(currentCardData.text);
                } else {
                    userChoices.features.push(currentCardData.text);
                }
            }

            // 2. Animate card out
            cardEl.classList.add(choice ? 'go-yes' : 'go-no');

            // 3. Update index and progress
            currentCardIndex++;
            progressBar.style.width = `${(currentCardIndex / vibeQuestions.length) * 100}%`;

            // 4. Update next cards
            setTimeout(updateCardStack, 100); // Give a slight delay for animation

            // 5. Check if done
            if (currentCardIndex === vibeQuestions.length) {
                setTimeout(showSummary, 600);
            }
        }

        // --- Show Summary Screen ---
        function showSummary() {
            gameContainer.style.display = 'none';
            summaryContainer.style.display = 'flex';

            let summaryText = "";
            if (userChoices.vibes.length > 0) {
                summaryText += `<li><i class="fas fa-check"></i> <strong>ה-Vibe שלי:</strong> ${userChoices.vibes.join(', ')}</li>`;
            } else {
                summaryText += `<li><i class="fas fa-check"></i> <strong>ה-Vibe שלי:</strong> פתוח להכל</li>`;
            }

            if (userChoices.features.length > 0) {
                summaryText += `<li><i class="fas fa-check"></i> <strong>דגשים:</strong> ${userChoices.features.join(', ')}</li>`;
            }
            
            summaryList.innerHTML = summaryText;

            // Build WhatsApp message
            let waMessage = "היי! סיימתי לסנן את ה-Vibe שלי בבוט:\n";
            waMessage += `*ה-Vibe שלי:* ${userChoices.vibes.length > 0 ? userChoices.vibes.join(', ') : 'פתוח להכל'}\n`;
            waMessage += `*דגשים:* ${userChoices.features.length > 0 ? userChoices.features.join(', ') : 'אין'}\n`;
            waMessage += "אשמח לקבל הצעות מהסוכן האישי שלכם!";
            
            whatsappLink.href = `https://wa.me/972523983394?text=${encodeURIComponent(waMessage)}`;
        }
        
        // --- Event Listeners ---
        yesBtn.addEventListener('click', () => handleChoice(true));
        noBtn.addEventListener('click', () => handleChoice(false));
        
        // --- Start ---
        initCards();
        
    </script>
</body>
</html>
