<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIBRAWN - דף הבית</title>
    <meta name="description" content="מולטיבראון - הסוכן האישי שלכם לאיתור לוקיישנים.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --site-accent: #FF5EA1; --site-text: #1a0b2e; }
        body { font-family: 'Heebo', sans-serif; background: linear-gradient(135deg, #00E0FF 0%, #2D7FFF 50%, #A06BFF 100%); color: var(--site-text); overflow-x: hidden; min-height: 100vh; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        /* Header */
        #main-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); height: 90px; display: flex; align-items: center; transition: 0.3s; }
        #main-header.scrolled { background: rgba(255, 255, 255, 0.4); }
        nav { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo img { width: 80px; height: 80px; transition: transform 0.3s; }
        .logo:hover img { transform: scale(1.1); }
        .logo span { font-size: 2rem; font-weight: 800; color: var(--site-text); font-family: 'Playfair Display', serif; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--site-text); text-decoration: none; font-size: 1.1rem; font-weight: 500; transition: 0.3s; position: relative; }
        .nav-links a:hover { color: var(--site-accent); }
        .nav-cta { background: var(--site-accent); color: white !important; padding: 0.7rem 1.8rem; border-radius: 50px; font-weight: 600; box-shadow: 0 4px 20px rgba(255, 94, 161, 0.4); }
        
        /* Hero */
        .hero-video { position: relative; width: 100%; height: 100vh; overflow: hidden; margin-top: -90px; }
        .video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .video-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(26,11,46,0.2), rgba(26,11,46,0.5)); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1; text-align: center; padding: 2rem; }
        .hero-title { font-size: clamp(3rem, 8vw, 6rem); margin-bottom: 1rem; text-shadow: 0 4px 30px rgba(0,0,0,0.5); font-weight: 900; color: white; line-height: 1.1; }
        .hero-subtitle { font-size: clamp(1.1rem, 2.5vw, 1.5rem); color: rgba(255,255,255,0.95); margin-bottom: 2rem; }
        .btn-primary { background: var(--site-accent); color: white; padding: 1rem 2.5rem; border-radius: 50px; font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 94, 161, 0.6); }
        .btn-glass { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; backdrop-filter: blur(10px); padding: 1rem 2.5rem; border-radius: 50px; font-weight: 700; transition: 0.3s; }
        .btn-glass:hover { background: rgba(255,255,255,0.3); transform: translateY(-3px); }

        /* Locations */
        .locations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 1400px; margin: 4rem auto; padding: 0 2rem; }
        .location-card { position: relative; aspect-ratio: 4/5; border-radius: 20px; overflow: hidden; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
        .location-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .location-card img { width: 100%; height: 100%; object-fit: cover; }
        .location-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); color: white; }
        
        /* Footer */
        footer { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 3rem 2rem; text-align: center; margin-top: 4rem; border-top: 1px solid rgba(255,255,255,0.2); }
        .footer-social a { margin: 0 10px; color: var(--site-text); font-size: 1.2rem; }
        
        /* Floating */
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 9999; transition: transform 0.3s; }
        .whatsapp-float:hover { transform: scale(1.1); }

        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
</head>
<body>
    <header id="main-header">

                <span>MULTIBRAWN</span>
            </a>
            <div class="nav-links">
                <a href="index.html" style="color: var(--site-accent);">דף הבית</a>
                <a href="gallery.html">גלריה</a>
                <a href="tips.html">טיפים חשובים</a>

    <section class="hero-video">

            <div class="hero-content" data-aos="fade-up">
                <h1 class="hero-title">הלוקיישן המושלם<br>מחכה לכם</h1>
                <p class="hero-subtitle">וילות יוקרה, צימרים ומתחמי אירועים בסטנדרט בינלאומי</p>
                <div class="hero-btn-group" style="display:flex; gap:1rem; justify-content:center; margin-top:2rem;">
                    <a href="contact.html" class="btn-primary">בואו נמצא לכם מקום</a>
                    <a href="gallery.html" class="btn-glass">צפו בגלריה</a>

    <section class="locations-grid">
        <a href="gallery.html#villas" class="location-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818934/22_tt9jvz.jpg"><div class="location-overlay"><h3>וילות מפוארות</h3></div></a>
        <a href="gallery.html#zimmer" class="location-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1763726367/AA_s4nej0.jpg"><div class="location-overlay"><h3>צימרים</h3></div></a>
        <a href="gallery.html#apartments" class="location-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Apartment1_mrxdad.jpg"><div class="location-overlay"><h3>דירות נופש</h3></div></a>
        <a href="gallery.html#hotels" class="location-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Hotel1_ihkey7.jpg"><div class="location-overlay"><h3>מלונות בוטיק</h3></div></a>
        <a href="gallery.html#events" class="location-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1762003191/1_tsc6xx.jpg"><div class="location-overlay"><h3>מתחמי אירועים</h3></div></a>
    </section>

    <a href="https://wa.me/972523983394?text=שלום,%20אני%20פונה%20מאתר%20מולטיבראון" target="_blank" class="whatsapp-float"><i class="fab fa-whatsapp"></i></a>

    <footer>
        <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
            <img src="https://github.com/kfischi/MULTIBRAWN-V.1/raw/main/Gallery/לוגו2.png" alt="Logo" style="width:60px; height:60px;">
            <span>MULTIBRAWN</span>
        </div>
        <div class="footer-social">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
        </div>
        <div style="margin-top: 1rem;">
            <a href="contact.html" class="bg-white text-indigo-900 px-8 py-3 rounded-full font-bold shadow-lg inline-block">הזמן עכשיו</a>
        </div>
        <p style="margin-top: 2rem; opacity: 0.7;">© 2025 MULTIBRAWN</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init(); window.addEventListener('scroll', () => { document.getElementById('main-header').classList.toggle('scrolled', window.scrollY > 50); });</script>
</body>
</html>
