<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MULTIBRAWN - גלריה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    
    <style>
        :root { --site-accent: #FF5EA1; --site-text: #1a0b2e; }
        body { font-family: 'Heebo', sans-serif; background: linear-gradient(135deg, #00E0FF 0%, #2D7FFF 50%, #A06BFF 100%); color: var(--site-text); overflow-x: hidden; min-height: 100vh; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        
        #main-header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); height: 90px; display: flex; align-items: center; }
        nav { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo img { width: 80px; height: 80px; }
        .logo span { font-size: 2rem; font-weight: 800; color: var(--site-text); font-family: 'Playfair Display', serif; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--site-text); text-decoration: none; font-size: 1.1rem; font-weight: 500; }
        .nav-cta { background: var(--site-accent); color: white !important; padding: 0.7rem 1.8rem; border-radius: 50px; font-weight: 600; box-shadow: 0 4px 20px rgba(255, 94, 161, 0.4); }

        .gallery-hero { min-height: 40vh; display: flex; align-items: center; justify-content: center; position: relative; color: white; text-align: center; background: url('https://res.cloudinary.com/dptyfvwyo/image/upload/v1762004983/HERO_zb7pwc.jpg') no-repeat center/cover; border-radius: 0 0 40px 40px; margin-bottom: 3rem; padding-top: 90px; }
        .gallery-hero::before { content:''; position: absolute; inset:0; background: rgba(0,0,0,0.3); border-radius: 0 0 40px 40px; }
        .hero-content { position: relative; z-index: 2; }
        
        .filter-container { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; padding: 1rem; margin-bottom: 2rem; }
        .filter-btn { padding: 0.6rem 1.5rem; border-radius: 50px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); cursor: pointer; transition: all 0.3s; font-weight: 600; }
        .filter-btn:hover, .filter-btn.active { background: var(--site-accent); color: white; border-color: var(--site-accent); }
        
        .category-section { margin-bottom: 4rem; padding: 0 2rem; max-width: 1400px; margin-left: auto; margin-right: auto; }
        .category-title { font-size: 1.8rem; margin-bottom: 1.5rem; padding-right: 1rem; color: var(--site-text); border-right: 5px solid var(--site-accent); display: inline-block; }
        
        .gallery-row { display: flex; gap: 1.5rem; overflow-x: auto; padding-bottom: 1.5rem; scrollbar-width: none; }
        .gallery-row::-webkit-scrollbar { display: none; }
        .gallery-card { flex: 0 0 300px; height: 400px; position: relative; border-radius: 15px; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
        .gallery-card:hover { transform: scale(1.05); }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
        
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 9999; }
        footer { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 3rem 2rem; text-align: center; margin-top: 4rem; border-top: 1px solid rgba(255,255,255,0.2); }
        
        @media (max-width: 768px) { .nav-links { display: none; } }
    </style>
</head>
<body>
    <header id="main-header">
        <nav>
            <a href="index.html" class="logo"><img src="https://github.com/kfischi/MULTIBRAWN-V.1/raw/main/Gallery/לוגו2.png" alt="Logo"><span>MULTIBRAWN</span></a>
            <div class="nav-links">
                <a href="index.html">דף הבית</a>
                <a href="gallery.html" style="color: var(--site-accent);">גלריה</a>
                <a href="tips.html">טיפים חשובים</a>
                <a href="about.html">אודות</a>

    <div class="gallery-hero">

            <a href="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Hotel2_ag6ani.jpg" class="glightbox gallery-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Hotel2_ag6ani.jpg"></a>

        </div>

    <div class="category-section" data-category="zimmer">

        <div class="gallery-row">

            <a href="https://res.cloudinary.com/dptyfvwyo/image/upload/v1763726074/A7_rwzsuo.jpg" class="glightbox gallery-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1763726074/A7_rwzsuo.jpg"></a>

    <div class="category-section" data-category="apartments">

        <div class="gallery-row">
            <a href="https://res.cloudinary.com/dptyfvwyo/image/upload/v1763724320/2_tlbzz1.jpg" class="glightbox gallery-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1763724320/2_tlbzz1.jpg"></a>
            <a href="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Apartment1_mrxdad.jpg" class="glightbox gallery-card"><img src="https://res.cloudinary.com/dptyfvwyo/image/upload/v1760818995/Apartment1_mrxdad.jpg"></a>

    <div class="category-section" data-category="hotels">

    <footer>
        <div style="margin-bottom:1rem;"><img src="https://github.com/kfischi/MULTIBRAWN-V.1/raw/main/Gallery/לוגו2.png" style="width:60px;margin:0 auto;"></div>
        <a href="contact.html" class="nav-cta" style="display:inline-block; margin-top:1rem;">הזמן עכשיו</a>
        <p style="margin-top:2rem; opacity:0.7;">© 2025 MULTIBRAWN</p>

    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        const lightbox = GLightbox({ touchNavigation: true, loop: true });
        
        // Handle URL Hash filtering on load
        window.addEventListener('load', () => {
            const hash = window.location.hash.substring(1);
            if(hash) filterGallery(hash);
        });

        function filterGallery(cat) {
            const sections = document.querySelectorAll('.category-section');
            sections.forEach(sec => {
                if(cat === 'all' || sec.dataset.category === cat) sec.style.display = 'block';
                else sec.style.display = 'none';
            });
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            // Simple check to highlight btn, logic can be improved
        }
    </script>
</body>
</html>
